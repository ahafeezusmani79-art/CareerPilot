
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="rocketGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="flameGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded background -->
  <rect width="64" height="64" rx="16" fill="#111025"/>

  <!-- Rocket body -->
  <path
    d="M45 8C32 10 20 22 18 39L27 48C44 46 56 34 58 21L45 8Z"
    fill="url(#rocketGradient)"
  />

  <!-- Rocket window -->
  <circle cx="40" cy="25" r="6" fill="#e0e7ff"/>
  <circle cx="40" cy="25" r="3" fill="#312e81"/>

  <!-- Left fin -->
  <path d="M19 36L8 43L9 54L25 46Z" fill="#8b5cf6"/>

  <!-- Bottom fin -->
  <path d="M28 45L22 58L34 55L39 43Z" fill="#7c3aed"/>

  <!-- Rocket flame -->
  <path d="M18 44C10 47 9 53 7 59C14 57 20 54 22 47Z"
    fill="url(#flameGradient)"/>
</svg>
